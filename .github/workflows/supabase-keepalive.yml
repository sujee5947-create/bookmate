# Supabase 무료 플랜 자동 일시정지(7일 비활성) 방지용 ping
name: Supabase Keep-Alive

on:
  schedule:
    - cron: "0 0 */3 * *"   # 3일마다 UTC 00:00 (한국시간 오전 9시)
  workflow_dispatch:         # Actions 탭에서 수동 실행(테스트)용

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      PING_TABLE: books
    steps:
      - name: Ping Supabase database
        run: |
          body=$(curl -s -w "\n%{http_code}" \
            "$SUPABASE_URL/rest/v1/$PING_TABLE?select=*&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY")
          status=$(echo "$body" | tail -n1)
          echo "HTTP status: $status"
          echo "$body" | head -n -1 | head -c 300; echo
          # 200: 정상 / 42501: DB가 쿼리를 받고 권한 거부(비로그인 차단 정책) → DB 활동으로 충분
          if [ "$status" -lt 400 ] || echo "$body" | grep -q '42501'; then
            echo "Ping OK — DB에 요청 도달"
          else
            echo "Ping 실패 — URL/키를 확인하세요"; exit 1
          fi
